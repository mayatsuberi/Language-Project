name: language_project_env
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core Python & Data Science ---
  - python=3.10
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn

  # --- Neuroimaging (ECoG & BIDS) ---
  - mne-base>=1.10      # Base neuroimaging package
  - mne-bids            # OpenNeuro datasets (loads BIDS structure)
  - pybids              # Querying BIDS layouts

  # --- Machine Learning & Stats ---
  - scikit-learn
  - statsmodels

  # --- Deep Learning ---
  - transformers        # Contextual embedding models (notebooks 01-04c)
  - pytorch             # Backend for transformers / himalaya's torch backend

  # --- Jupyter Environment ---
  - jupyterlab
  - ipykernel

  # --- Pip Specific Packages ---
  - pip
  - pip:
    - himalaya          # Ridge/banded regression encoding models (notebook 06)
    - wikipedia-api
    - fasttext-wheel
    - googletrans==4.0.0-rc1
    - huggingface_hub>=0.24
    - httpx>=0.27
