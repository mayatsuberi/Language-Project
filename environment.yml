name: language_project_env
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core Python & Data Science ---
  - python=3.10
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn

  # --- Neuroimaging (ECoG & BIDS) ---
  - mne-bids            # OpenNeuro datasets (loads BIDS structure)
  - pybids              # Querying BIDS layouts
  - h5py                # Loading many ECoG data formats
  - nibabel             # Handles neuroimaging file formats

  # --- Machine Learning & Stats ---
  - scikit-learn
  - statsmodels

  # --- NLP & Text Processing ---
  - gensim              # For your Static Embeddings (FastText/Word2Vec)
  - spacy               # For POS tagging (filtering content words)

  # --- Deep Learning ---
  - transformers        # For the GPT-2 comparison mentioned in the report
  - pytorch             # Dependency for transformers

  # --- Jupyter Environment ---
  - jupyterlab
  - ipykernel

  # --- Pip Specific Packages ---
  - pip
  - pip:
    - mne>=1.6            # pinned away from broken 0.16.2 conda build
    - nilearn             # brain imaging viz (plot_markers)
    - himalaya            # Ridge regression backend for static_encoding.py
    - wikipedia-api
    - fasttext-wheel
    - googletrans==4.0.0-rc1
    - huggingface_hub>=0.24
    - httpx>=0.27
    - stanza>=1.0.0